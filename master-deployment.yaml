---
apiVersion: v1
kind: Service
metadata:
  name: exposure
spec:
  selector:
    app: second-app
  ports:
    - protocol: "TCP"
      port: 8080
      targetPort: 8080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: second-app
  template:
    metadata:
      labels:
        app: second-app
    spec:
      containers:
        - name: kub-second-app
          image: javalord001/kub-first-app:v3
